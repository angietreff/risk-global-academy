<html lang="sv">

<title>Atlas Academy</title>

<style>
:root{
  --bg:#f3f1eb;
  --surface:#ffffff;
  --soft:#f8f7f3;
  --dark:#172220;

  --green2:#35665c;
  --green-soft:#e2ebe7;
  --gold:#b89155;
  --gold-dark:#876632;
  --sand:#efe5d3;
  --blue:#e5ecf3;
  --red:#a05d53;
  --red-soft:#f3e2df;
  --text:#182321;
  --muted:#69726f;
  --border:#dedfd9;
  --shadow:0 16px 45px rgba(24,35,33,.08);
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:

  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.55;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidebar{

.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

.btn-dark{background:var(--dark);color:white}
.btn-light{background:white;color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:white}
.btn-danger{background:var(--red-soft);color:var(--red)}

.card{

.card h3{font:500 24px Georgia,serif}
.muted{color:var(--muted)}

.progress-track{height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:15px}
.progress-fill{height:100%;width:0;background:var(--gold);border-radius:999px;transition:.3s}
.section-title{margin-top:34px}
.section-title h2{font:500 27px Georgia,serif}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin-top:18px}
.course{
  background:white;border:1px solid var(--border);border-radius:var(--radius);
  padding:23px;min-height:300px;display:flex;flex-direction:column
}

  width:49px;height:49px;border-radius:14px;background:var(--green-soft);

}
.course h3{font:500 24px Georgia,serif;margin-top:18px}
.course p{font-size:13px;color:var(--muted);margin-top:9px}
.course-footer{margin-top:auto;padding-top:20px}
.course-track{height:6px;background:#ecece8;border-radius:999px;overflow:hidden;margin:7px 0 13px}
.course-track span{display:block;width:0;height:100%;background:var(--green)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter{
  border:1px solid var(--border);background:white;padding:8px 12px;
  border-radius:999px;font-size:12px;font-weight:700
}
.filter.active{background:var(--dark);color:white;border-color:var(--dark)}
.lesson-list{display:grid;gap:10px}
.lesson{
  display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;
  padding:16px;background:white;border:1px solid var(--border);border-radius:14px
}
.lesson-number{
  width:48px;height:48px;border-radius:13px;display:grid;place-items:center;
  background:var(--green-soft);font-weight:800
}
.lesson.completed .lesson-number{background:var(--green);color:white}
.lesson h3{font:500 18px Georgia,serif}
.lesson p{font-size:12px;color:var(--muted);margin-top:3px}
.lesson-shell{max-width:860px;margin:auto}
.lesson-header{

}
.lesson-header h2{font:500 clamp(31px,5vw,46px) Georgia,serif;line-height:1.08}
